name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download assets
        run: |
          pip install awscli --quiet
          mkdir -p public
          aws s3 cp s3://$AWS_BUCKET/ public/ --recursive --endpoint-url $AWS_ENDPOINT_URL
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}

      - name: Build and prerender
        run: |
          cd app/herbaliciousbliss-site
          bun run build
          bun ./start.ts &
          sleep 5
          bun ./prerender.ts
          kill %1
        env:
          NODE_ENV: production
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
          AWS_REGION: auto
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify build output
        run: |
          echo "Checking dist/browser/ for expected HTML files..."
          test -f app/herbaliciousbliss-site/dist/browser/index.html \
            || { echo "FAIL: missing dist/browser/index.html"; exit 1; }
          test -f app/herbaliciousbliss-site/dist/browser/lyra/index.html \
            || { echo "FAIL: missing dist/browser/lyra/index.html"; exit 1; }
          echo "Build output verified: index.html and lyra/index.html present"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/herbaliciousbliss-site/dist/browser --project-name=herbaliciousbliss

      - name: Smoke test live site
        run: |
          for path in "/" "/lyra"; do
            status=$(curl -sL -o /dev/null -w "%{http_code}" "https://hb.briantakita.me${path}")
            if [ "$status" != "200" ]; then
              echo "FAIL: https://hb.briantakita.me${path} returned $status"
              exit 1
            fi
            echo "OK: https://hb.briantakita.me${path} returned 200"
          done
